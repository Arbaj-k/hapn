<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f45ff"><meta name="robots" content="noindex,follow"><title>Send a Message – Hapn</title><link rel="icon" href="/assets/images/logo.svg"><link rel="stylesheet" href="/css/style.css"><style>
.inbox-wrap{max-width:680px;margin:44px auto;padding:0 18px 80px}.inbox-card{background:#fff;border:1px solid #e5e7ef;border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:0 18px 50px rgba(20,30,80,.07)}.inbox-card h1{font-size:clamp(28px,5vw,38px);margin:0 0 8px}.inbox-card .lead{color:#606984;margin-bottom:24px}.inbox-form label{display:block;font-weight:650;font-size:14px;margin:15px 0 6px}.inbox-form input,.inbox-form textarea,.inbox-form select{width:100%;border:1px solid #dfe2ee;border-radius:12px;padding:13px 14px;font:inherit;background:#fff;color:#111936}.inbox-form textarea{min-height:150px;resize:vertical}.inbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.inbox-note{font-size:13px;color:#69718a;margin-top:8px}.inbox-status{margin:14px 0;padding:12px 14px;border-radius:10px;background:#f0f3ff;color:#2437c8}.inbox-status.error{background:#fff0f0;color:#a21e1e}.inbox-form button{width:100%;margin-top:20px}@media(max-width:560px){.inbox-grid{grid-template-columns:1fr}.inbox-wrap{margin:24px auto}}
</style></head><body data-root="">
<header class="site-header"><div class="container header-inner"><a class="brand" href="/"><img src="/assets/images/logo.svg" width="34" height="34" alt=""><span>Hapn</span></a><a class="btn btn-outline" href="/">Back to Hapn</a></div></header>
<main class="inbox-wrap"><section class="inbox-card"><p class="eyebrow">HAPN INBOX</p><h1>Send us a message</h1><p class="lead">Questions, feedback or a problem? Send a message to the team. You can contact us without signing in.</p>
<div id="inbox-status" class="inbox-status" hidden role="status"></div>
<form id="inbox-form" class="inbox-form">
<label for="college">Your college</label><select id="college" required><option value="">Loading colleges…</option></select>
<div class="inbox-grid"><div><label for="first-name">First name</label><input id="first-name" name="first_name" maxlength="60" autocomplete="given-name" required></div><div><label for="last-name">Last name</label><input id="last-name" name="last_name" maxlength="60" autocomplete="family-name" required></div></div>
<label for="email">Email address</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
<label for="phone">Phone number <span style="font-weight:400;color:#737b91">(optional)</span></label><input id="phone" name="phone" type="tel" maxlength="24" autocomplete="tel" placeholder="+91">
<label for="message">Write your message here</label><textarea id="message" name="message" minlength="5" maxlength="5000" placeholder="Tell us how we can help…" required></textarea>
<p class="inbox-note">Your contact details are visible only to authorised Hapn administrators handling your college’s inbox.</p>
<button class="btn btn-primary btn-lg" id="send-button" type="submit">Send Message</button></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="/js/config.js"></script><script src="/js/supabase.js"></script><script src="/js/send-message.js?v=20261126inbox1"></script></body></html>
