name: Deploy Hapn to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Run production hardening regression tests
        run: node tests/production-hardening-smoke.cjs

      - name: Verify campus partners and organiser guide
        run: node tests/campus-partners-smoke.cjs

      - name: Verify LLM brand knowledge and entity markup
        run: node tests/llmo-brand-knowledge-smoke.cjs

      - name: Verify university events landing page
        run: node tests/university-events-smoke.cjs

      - name: Verify editorial policy and trust content
        run: node tests/editorial-policy-smoke.cjs

      - name: Verify generated event SEO pages
        run: node tests/event-seo-smoke.cjs

      - name: Verify Cloudflare security Worker
        run: node tests/cloudflare-worker-smoke.cjs

      - name: Generate browser config from repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node build-config.js

      - name: Generate published-event sitemap and static event pages
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node generate-sitemap.js

      - name: Assemble explicit Pages output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude=".git/" --exclude=".github/" --exclude="_site/" ./ _site/
          test -f sitemap.xml
          sitemap_event_count=$(grep -Ec '<loc>https://hapn.info/event/[^<]+/</loc>' sitemap.xml || true)
          echo "Sitemap event URLs: $sitemap_event_count"
          test "$sitemap_event_count" -gt 0
          cp sitemap.xml _site/sitemap.xml
          test -f _site/index.html
          site_event_count=$(find _site/event -mindepth 2 -maxdepth 2 -type f -name index.html 2>/dev/null | wc -l)
          echo "Pages artifact event pages: $site_event_count"
          echo "Pages output contains:"
          ls -la _site | sed -n "1,80p"

      - name: Verify sitemap before deployment
        shell: bash
        run: |
          set -euo pipefail
          echo "Sitemap URL count: $(grep -c '<loc>' sitemap.xml)"
          grep -Eq '<loc>https://hapn.info/event/[^<]+/</loc>' sitemap.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
